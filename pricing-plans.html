    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5c842;
            --gold-dark: #c9a020;
            --red: #e94560;
            --red-dark: #c0392b;
            --bg: #0b0a0a;
            --bg-card: #141212;
            --bg-input: #1e1b1b;
            --text: #f0ede8;
            --text-muted: #a8a39a;
            --border: #2a2626;
            --radius: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--gold);
            text-decoration: none;
            transition: var(--transition);
        }
        a:hover {
            color: var(--red);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        /* ----- TYPOGRAPHY ----- */
        .serif {
            font-family: 'Playfair Display', serif;
        }
        .oswald {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .gold {
            color: var(--gold);
        }
        .red {
            color: var(--red);
        }

        .section-label {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
            margin-bottom: 12px;
            display: block;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .section-title .gold {
            font-style: italic;
        }

        /* ----- HEADER / NAV ----- */
        header {
            padding: 20px 0 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(11, 10, 10, 0.95);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo .red {
            font-style: italic;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
        }
        .nav-links a:hover {
            color: var(--text);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .lang-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            text-transform: uppercase;
        }
        .lang-toggle:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ----- HERO / PAGE TITLE ----- */
        .page-hero {
            padding: 60px 0 40px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--bg) 0%, #1a1410 100%);
        }

        .page-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 12px;
        }
        .page-hero h1 .gold {
            font-style: italic;
        }

        .page-hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* ----- PRICING GRID ----- */
        .pricing {
            padding: 60px 0 80px;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .pricing-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 24px 28px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .pricing-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .pricing-card .badge {
            position: absolute;
            top: -10px;
            right: 20px;
            background: var(--gold);
            color: #0b0a0a;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 16px;
            border-radius: 50px;
        }

        .pricing-card .plan-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .pricing-card .plan-price {
            font-family: 'Oswald', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--gold);
            margin: 8px 0 4px;
        }
        .pricing-card .plan-price small {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
        }

        .pricing-card .plan-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 16px;
            min-height: 44px;
        }

        .pricing-card .plan-features {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            flex: 1;
        }
        .pricing-card .plan-features li {
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pricing-card .plan-features li:last-child {
            border-bottom: none;
        }
        .pricing-card .plan-features li .check {
            color: var(--gold);
            font-weight: 700;
        }

        .pricing-card .btn-select {
            display: inline-block;
            background: var(--gold);
            color: #0b0a0a;
            font-weight: 700;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .pricing-card .btn-select:hover {
            background: #e6b832;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 200, 66, 0.25);
        }

        /* ----- FOOTER ----- */
        footer {
            border-top: 1px solid var(--border);
            padding: 32px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 300;
        }
        footer .gold {
            font-weight: 500;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 820px) {
            .header-inner {
                flex-direction: column;
                align-items: center;
            }
            .nav-links {
                gap: 16px;
                font-size: 0.75rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .pricing-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .pricing-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 0 auto;
            }
            .container {
                padding: 0 16px;
            }
            .page-hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

            // =========================================================
            //  🔍 DETECT LANGUAGE
            // =========================================================
            function detectLanguage() {
                let raw = navigator.language;
                if (!raw || raw === '') {
                    raw = navigator.languages?.[0] || 'en';
                }
                const map = {
                    'es': 'es', 'fa': 'fa', 'ko': 'ko', 'ar': 'ar',
                    'ru': 'ru', 'zh': 'zh', 'so': 'so', 'en': 'en'
                };
                let detected = 'en';
                if (map[raw]) {
                    detected = map[raw];
                } else {
                    const prefix = raw.substring(0, 2);
                    if (map[prefix]) {
                        detected = map[prefix];
                    }
                }
                return detected;
            }

            // =========================================================
            //  🌐 APPLY TRANSLATIONS
            // =========================================================
            function applyLanguage(lang) {
                const t = translations[lang] || translations.en;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (t[key] !== undefined) {
                        if (el.querySelector('strong, span, br')) {
                            el.innerHTML = t[key];
                        } else {
                            el.textContent = t[key];
                        }
                    }
                });
                document.documentElement.lang = lang;
                window.__currentLang = lang;
                // Re-render pricing cards with the new language
                renderPricingCards(lang);
            }

                    badge: 'best',
                    trial: false
                },
                {
                    id: 'university-athlete',
                    key: 'athlete',
                    price: '24.99',
                    stripeLink: 'https://buy.stripe.com/4gM6oH0qQabWbYagaD73G0c',
                    badge: null,
                    trial: true
                },
                {
                    id: 'university-season-athlete',
                    key: 'season',
                    price: '79.99',
                    stripeLink: 'https://buy.stripe.com/dRmbJ18Xmbg05zMgaD73G0d',
                    badge: null,
                    trial: false
                },
                {
                    id: 'cta-program',
                    key: 'cta',
                    price: '14.99',
                    stripeLink: 'https://buy.stripe.com/5kQ8wPddCgAk9Q27E773G0e',
                    badge: null,
                    trial: true
                }
            ];

            // Feature keys for each plan
            const featureKeys = {
                crown: ['feat_crown_1', 'feat_crown_2', 'feat_crown_3'],
                insider: ['feat_insider_1', 'feat_insider_2', 'feat_insider_3', 'feat_insider_4'],
                builder: ['feat_builder_1', 'feat_builder_2', 'feat_builder_3', 'feat_builder_4', 'feat_builder_5', 'feat_builder_6'],
                athlete: ['feat_athlete_1', 'feat_athlete_2', 'feat_athlete_3', 'feat_athlete_4', 'feat_athlete_5', 'feat_athlete_6', 'feat_athlete_7', 'feat_athlete_8', 'feat_athlete_9', 'feat_athlete_10'],
                season: ['feat_season_1', 'feat_season_2', 'feat_season_3', 'feat_season_4', 'feat_season_5', 'feat_season_6'],
                cta: ['feat_cta_1', 'feat_cta_2', 'feat_cta_3', 'feat_cta_4', 'feat_cta_5', 'feat_cta_6', 'feat_cta_7', 'feat_cta_8']
            };

            // =========================================================
            //  🖨️ RENDER PRICING CARDS (with Direct Stripe Links)
            // =========================================================
            function renderPricingCards(lang) {
                const t = translations[lang] || translations.en;
                const grid = document.getElementById('pricingGrid');
                if (!grid) return;

                let html = '';
                plans.forEach(plan => {
                    const features = featureKeys[plan.key] || [];
                    const titleKey = 'plan_' + plan.key + '_title';
                    const descKey = 'plan_' + plan.key + '_desc';

                    let badgeHtml = '';
                    if (plan.badge === 'best') {
                        badgeHtml = `<span class="badge">${t.badge_best || 'Best Value'}</span>`;
                    }
                    let trialHtml = '';
                    if (plan.trial) {
                        trialHtml = `<div style="font-size:0.8rem;color:var(--gold);margin-bottom:8px;">${t.badge_trial || '30-Day Free Trial'}</div>`;
                    }

                    let featuresHtml = '';
                    features.forEach(fk => {
                        if (t[fk]) {
                            featuresHtml += `<li><span class="check">✦</span> ${t[fk]}</li>`;
                        }
                    });

                    html += `
                        <div class="pricing-card">
                            ${badgeHtml}
                            <div class="plan-name">${t[titleKey] || plan.key}</div>
                            <div class="plan-price">$${plan.price} <small>/ month</small></div>
                            ${trialHtml}
                            <div class="plan-desc">${t[descKey] || ''}</div>
                            <ul class="plan-features">
                                ${featuresHtml}
                            </ul>
                            <a href="${plan.stripeLink}" target="_blank" class="btn-select">${t.btn_select || 'Select Plan'}</a>
                        </div>
                    `;
                });

                grid.innerHTML = html;
            }

            // =========================================================
            //  🔄 LANGUAGE TOGGLE
            // =========================================================
            const langCycle = ['en', 'es', 'fa', 'ko', 'ar', 'ru', 'zh', 'so'];
            document.getElementById('langToggle').addEventListener('click', function() {
                const current = window.__currentLang || 'en';
                let idx = langCycle.indexOf(current);
                if (idx === -1) idx = 0;
                idx = (idx + 1) % langCycle.length;
                applyLanguage(langCycle[idx]);
            });

            // =========================================================
            //  🚀 INIT
            // =========================================================
            function init() {
                const detected = detectLanguage();
                applyLanguage(detected);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
