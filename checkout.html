    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

    <meta http-equiv="Expires" content="0" />
    <title>Wordwell – Checkout</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5c842;
            --gold-dark: #c9a020;
            --red: #e94560;
            --red-dark: #c0392b;
            --bg: #0b0a0a;
            --bg-card: #141212;
            --bg-input: #1e1b1b;
            --text: #f0ede8;
            --text-muted: #a8a39a;
            --border: #2a2626;
            --radius: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--gold);
            text-decoration: none;
            transition: var(--transition);
        }
        a:hover {
            color: var(--red);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        /* ----- TYPOGRAPHY ----- */
        .serif {
            font-family: 'Playfair Display', serif;
        }
        .oswald {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .gold {
            color: var(--gold);
        }
        .red {
            color: var(--red);
        }

        /* ----- HEADER / NAV ----- */
        header {
            padding: 20px 0 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(11, 10, 10, 0.95);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo .red {
            font-style: italic;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
        }
        .nav-links a:hover {
            color: var(--text);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .lang-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            text-transform: uppercase;
        }
        .lang-toggle:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ----- CHECKOUT ----- */
        .checkout {
            padding: 50px 0 80px;
        }

        .checkout-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 50px;
            margin-top: 30px;
        }

        .checkout-summary {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px 28px;
            position: sticky;
            top: 100px;
        }

        .checkout-summary h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .checkout-summary .plan-detail {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .checkout-summary .plan-detail:last-child {
            border-bottom: none;
        }

        .checkout-summary .plan-detail .label {
            color: var(--text-muted);
            font-weight: 300;
        }

        .checkout-summary .plan-detail .value {
            font-weight: 600;
        }

        .checkout-summary .total {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            color: var(--gold);
            margin-top: 12px;
            text-align: right;
        }

        .checkout-form {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px 28px;
        }

        .checkout-form h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 200, 66, 0.12);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-submit {
            background: var(--gold);
            color: #0b0a0a;
            font-weight: 700;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #e6b832;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 200, 66, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .form-status {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-size: 0.95rem;
            display: none;
        }
        .form-status.success {
            display: block;
            background: rgba(245, 200, 66, 0.12);
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .form-status.error {
            display: block;
            background: rgba(233, 69, 96, 0.12);
            border: 1px solid var(--red);
            color: var(--red);
        }

        .stripe-product-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 6px;
            margin-top: 12px;
            display: inline-block;
            border: 1px solid var(--border);
        }

        /* ----- FOOTER ----- */
        footer {
            border-top: 1px solid var(--border);
            padding: 32px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 300;
        }
        footer .gold {
            font-weight: 500;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 820px) {
            .checkout-wrapper {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .checkout-summary {
                position: static;
            }
            .header-inner {
                flex-direction: column;
                align-items: center;
            }
            .nav-links {
                gap: 16px;
                font-size: 0.75rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }
            .checkout-form,
            .checkout-summary {
                padding: 20px 16px;
            }
        }
    </style>
</head>

                    <form id="checkoutForm">
                        <div class="form-group">
                            <label for="fullName" data-i18n="form_fullname">Full Name</label>
                            <input type="text" id="fullName" name="fullName" placeholder="John Doe" required />
                        </div>
                        <div class="form-group">
                            <label for="email" data-i18n="form_email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com" required />
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cardNumber" data-i18n="form_card">Card Number</label>
                                <input type="text" id="cardNumber" name="cardNumber" placeholder="4242 4242 4242 4242" required />

                                <label for="zipCode" data-i18n="form_zip">Zip / Postal Code</label>
                                <input type="text" id="zipCode" name="zipCode" placeholder="10001" required />
                            </div>
                        </div>

                        <button type="submit" class="btn-submit" id="submitBtn">
                            <span data-i18n="form_submit">✧ Complete Purchase</span>
                        </button>

                        <div class="form-status" id="formStatus"></div>
                    </form>
                </div>
            </div>
        </div>
    </section>

            <span data-i18n="footer_tagline">Only Elite. Only the Few. Only Wordwell.</span></div>

            // =========================================================
            //  🔍 DETECT LANGUAGE
            // =========================================================
            function detectLanguage() {
                let raw = navigator.language;
                if (!raw || raw === '') {
                    raw = navigator.languages?.[0] || 'en';
                }
                const map = {
                    'es': 'es', 'fa': 'fa', 'ko': 'ko', 'ar': 'ar',
                    'ru': 'ru', 'zh': 'zh', 'so': 'so', 'en': 'en'
                };
                let detected = 'en';
                if (map[raw]) {
                    detected = map[raw];
                } else {
                    const prefix = raw.substring(0, 2);
                    if (map[prefix]) {
                        detected = map[prefix];
                    }
                }
                return detected;
            }

            // =========================================================
            //  🌐 APPLY TRANSLATIONS
            // =========================================================
            function applyLanguage(lang) {
                const t = translations[lang] || translations.en;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (t[key] !== undefined) {
                        if (el.querySelector('strong, span, br')) {
                            el.innerHTML = t[key];
                        } else {
                            el.textContent = t[key];
                        }
                    }
                });
                document.documentElement.lang = lang;
                window.__currentLang = lang;
            }

            // =========================================================
            //  🔄 LANGUAGE TOGGLE
            // =========================================================
            const langCycle = ['en', 'es', 'fa', 'ko', 'ar', 'ru', 'zh', 'so'];
            document.getElementById('langToggle').addEventListener('click', function() {
                const current = window.__currentLang || 'en';
                let idx = langCycle.indexOf(current);
                if (idx === -1) idx = 0;
                idx = (idx + 1) % langCycle.length;
                applyLanguage(langCycle[idx]);
            });

                'league-insider': { name: 'League Insider', price: '9.99', productId: 'prod_UxRei8fPSz9H3Z' },
                'franchise-builder': { name: 'Franchise Builder', price: '19.99', productId: 'prod_UxRgpz9sjdFGux' },
                'university-athlete': { name: 'University Athlete', price: '24.99', productId: 'prod_UxRi6nCLPwK4oo' },
                'university-season-athlete': { name: 'University Season Athlete', price: '79.99', productId: 'prod_UxRjJ5P2GPsyGd' },
                'cta-program': { name: 'CTA Program', price: '14.99', productId: 'prod_UxRkjyGLOBDwhP' }
            };

            // =========================================================
            //  🚀 INIT – get plan from URL
            // =========================================================
            function initCheckout() {
                const urlParams = new URLSearchParams(window.location.search);
                const checkoutId = urlParams.get('checkoutId') || 'N/A';
                const planId = urlParams.get('plan') || 'crown-talk-fan';

                const plan = planData[planId];
                if (!plan) {
                    // fallback
                    document.getElementById('orderPlan').textContent = 'Unknown Plan';
                    document.getElementById('orderPrice').textContent = '$0.00 / month';
                    document.getElementById('orderTotal').textContent = '$0.00';
                    document.getElementById('stripeProductId').textContent = '—';
                    return;
                }

                document.getElementById('orderPlan').textContent = plan.name;
                document.getElementById('orderPrice').textContent = '$' + plan.price + ' / month';
                document.getElementById('orderTotal').textContent = '$' + plan.price;
                document.getElementById('stripeProductId').textContent = plan.productId;

                // Store for form submission
                window.__checkoutData = { planId, planName: plan.name, planPrice: plan.price, productId: plan.productId, checkoutId };
            }

            // =========================================================
            //  📧 FORM SUBMISSION (simulate Stripe Checkout)
            // =========================================================
            const form = document.getElementById('checkoutForm');
            const status = document.getElementById('formStatus');
            const submitBtn = document.getElementById('submitBtn');

            function setStatus(message, type) {
                status.textContent = message;
                status.className = 'form-status ' + type;
                status.style.display = 'block';
            }

            function resetStatus() {
                status.className = 'form-status';
                status.style.display = 'none';
                status.textContent = '';
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const name = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const card = document.getElementById('cardNumber').value.trim();
                const expiry = document.getElementById('cardExpiry').value.trim();
                const cvc = document.getElementById('cardCvc').value.trim();
                const zip = document.getElementById('zipCode').value.trim();

                if (!name || !email || !card || !expiry || !cvc || !zip) {
                    const lang = window.__currentLang || 'en';
                    const errorMsg = lang === 'es' ? 'Por favor, completa todos los campos.' :
                                     lang === 'fa' ? 'لطفاً تمام فیلدها را پر کنید.' :
                                     lang === 'ko' ? '모든 필드를 입력해주세요.' :
                                     lang === 'ar' ? 'يرجى ملء جميع الحقول.' :
                                     lang === 'ru' ? 'Пожалуйста, заполните все поля.' :
                                     lang === 'zh' ? '请填写所有字段。' :
                                     lang === 'so' ? 'Fadlan buuxi dhammaan goobaha.' :
                                     'Please fill in all fields.';
                    setStatus(errorMsg, 'error');
                    return;
                }

                submitBtn.disabled = true;
                const lang = window.__currentLang || 'en';
                const sendingText = lang === 'es' ? '✧ Procesando...' :
                                     lang === 'fa' ? '✧ در حال پردازش...' :
                                     lang === 'ko' ? '✧ 처리 중...' :
                                     lang === 'ar' ? '✧ جاري المعالجة...' :
                                     lang === 'ru' ? '✧ Обработка...' :
                                     lang === 'zh' ? '✧ 处理中...' :
                                     lang === 'so' ? '✧ Hawl gelin...' :
                                     '✧ Processing...';
                submitBtn.innerHTML = sendingText;
                resetStatus();

                // Simulate payment processing
                setTimeout(function() {
                    const lang = window.__currentLang || 'en';
                    const successMsg = lang === 'es' ? '✓ ¡Pago completado! Redirigiendo a Stripe...' :
                                        lang === 'fa' ? '✓ پرداخت تکمیل شد! در حال انتقال به Stripe...' :
                                        lang === 'ko' ? '✓ 결제가 완료되었습니다! Stripe로 리디렉션 중...' :
                                        lang === 'ar' ? '✓ تم إتمام الدفع! جاري التوجيه إلى Stripe...' :
                                        lang === 'ru' ? '✓ Оплата завершена! Перенаправление на Stripe...' :
                                        lang === 'zh' ? '✓ 付款已完成！正在重定向到 Stripe...' :
                                        lang === 'so' ? '✓ Bixinta waa la dhammeeyey! Loo wareejinayaa Stripe...' :
                                        '✓ Payment completed! Redirecting to Stripe...';
                    setStatus(successMsg, 'success');
                    submitBtn.disabled = false;
                    const submitText = lang === 'es' ? '✧ Completar Compra' :
                                        lang === 'fa' ? '✧ تکمیل خرید' :
                                        lang === 'ko' ? '✧ 구매 완료' :
                                        lang === 'ar' ? '✧ إكمال الشراء' :
                                        lang === 'ru' ? '✧ Завершить покупку' :
                                        lang === 'zh' ? '✧ 完成购买' :
                                        lang === 'so' ? '✧ Dhammeystir Iibsiga' :
                                        '✧ Complete Purchase';
                    submitBtn.innerHTML = submitText;
                    form.reset();

                    // In a real implementation, you would redirect to Stripe Checkout using the product ID
                    // For demo, we open a new window with a Stripe product page (or you can replace with your actual checkout URL)
                    // Example: window.location.href = 'https://buy.stripe.com/test_...';
                    // For now, we just show a link
                    const productId = window.__checkoutData?.productId || '';
                    if (productId) {
                        // Simulate redirect to Stripe Checkout (you need to create a session server-side)
                        // For demonstration, we'll just show an alert with the product ID
                        setTimeout(function() {
                            alert('Redirect to Stripe Checkout for product: ' + productId + '\n\nIn production, this would redirect to your Stripe Checkout session URL.');
                            // Optionally redirect to a Stripe product page (public view)
                            // window.location.href = 'https://buy.stripe.com/' + productId;
                        }, 500);
                    }
                }, 1500);
            });

            // =========================================================
            //  🚀 INIT
            // =========================================================
            function init() {
                const detected = detectLanguage();
                applyLanguage(detected);
                initCheckout();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
