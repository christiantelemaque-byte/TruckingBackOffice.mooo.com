<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON SURVIVOR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      touch-action: none;
    }
    #gameWrapper {
      position: relative;
      background: #0d0d20;
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.08), inset 0 0 60px rgba(0, 0, 0, 0.6);
      padding: 12px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      background: radial-gradient(circle at center, #141430, #050510);
      border-radius: 16px;
      image-rendering: pixelated;
      touch-action: none;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      color: #aaccff;
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
    }
    #ui span {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(0, 240, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #ui .gold {
      color: #ffcc00;
    }
    #ui .hp {
      color: #ff4466;
    }
    #gameOverlay {
      position: absolute;
      inset: 12px;
      border-radius: 16px;
      background: rgba(5, 5, 20, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: auto;
      z-index: 10;
    }
    #gameOverlay.show {
      display: flex;
    }
    #gameOverlay h1 {
      font-size: 48px;
      background: linear-gradient(135deg, #ff00e5, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #gameOverlay p {
      color: #8899cc;
      font-size: 20px;
    }
    #gameOverlay .btn {
      padding: 14px 44px;
      border: none;
      border-radius: 60px;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #00f0ff, #0066ff);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
      transition: 0.2s;
      pointer-events: auto;
      margin-top: 8px;
    }
    #gameOverlay .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.5);
    }
    #gameOverlay .btn:active {
      transform: scale(0.95);
    }
    #controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      pointer-events: none;
    }
    #controls button {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 8px 20px;
      color: #aaccff;
      font-size: 14px;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: 0.2s;
    }
    #controls button:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: #00f0ff;
    }
    @media (max-width: 500px) {
      #ui {
        font-size: 14px;
        top: 12px;
        left: 12px;
        right: 12px;
      }
      #ui span {
        padding: 4px 12px;
      }
      #gameOverlay h1 {
        font-size: 32px;
      }
      #gameOverlay .btn {
        padding: 10px 30px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="ui">
      <span>❤️ <span class="hp" id="hpDisplay">100</span></span>
      <span>⚡ <span id="scoreDisplay">0</span></span>
      <span>🌊 <span id="waveDisplay">1</span></span>
    </div>
    <div id="gameOverlay">
      <h1 id="overlayTitle">GAME OVER</h1>
      <p id="overlayScore">Score: 0</p>
      <button class="btn" id="restartBtn">▶ PLAY AGAIN</button>
    </div>
    <div id="controls">
      <button id="pauseBtn">⏸ PAUSE</button>
    </div>
  </div>

  <script>
    // ================================================================
    //  NEON SURVIVOR – Full Game (Canvas + ZzFX Sound)
    // ================================================================

    (function() {
      'use strict';

      // -------- DOM refs --------
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const hpSpan = document.getElementById('hpDisplay');
      const scoreSpan = document.getElementById('scoreDisplay');
      const waveSpan = document.getElementById('waveDisplay');
      const overlay = document.getElementById('gameOverlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayScore = document.getElementById('overlayScore');
      const restartBtn = document.getElementById('restartBtn');
      const pauseBtn = document.getElementById('pauseBtn');

      // -------- Constants --------
      const W = 600,
        H = 600;
      const PLAYER_RADIUS = 16;
      const ENEMY_BASE_RADIUS = 12;
      const PLAYER_SPEED = 4.5;
      const BULLET_SPEED = 8;
      const BULLET_RADIUS = 4;
      const MAX_HP = 100;

      // -------- State --------
      let player = { x: W / 2, y: H / 2, radius: PLAYER_RADIUS, hp: MAX_HP, maxHp: MAX_HP };
      let bullets = [];
      let enemies = [];
      let particles = [];
      let score = 0;
      let wave = 1;
      let gameRunning = true;
      let gamePaused = false;
      let gameOver = false;
      let frame = 0;
      let keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };
      let mouse = { x: W / 2, y: H / 2, pressed: false };

      // Enemy spawning parameters
      let spawnTimer = 0;
      let spawnInterval = 60; // frames
      let enemiesPerWave = 5;
      let enemySpeed = 1.2;
      let enemyCount = 0;

      // -------- Sound (ZzFX) --------
      const zzfx = (...args) => {
        let zzfxR = 0,
          zzfxV = 0.3,
          zzfxQ = 0,
          zzfxS = 0,
          zzfxZ = 0,
          zzfxX = 0,
          zzfxC = 0,
          zzfxM = 0,
          zzfxU = 0,
          zzfxL = 0,
          zzfxA = 0,
          zzfxW = 0,
          zzfxH = 0,
          zzfxG = 0;
        let vol = 0.3,
          sampleRate = 44100;
        if (args.length > 0) { zzfxR = args[0] || 0;
          zzfxV = args[1] || 0.3;
          zzfxQ = args[2] || 0;
          zzfxS = args[3] || 0;
          zzfxZ = args[4] || 0;
          zzfxX = args[5] || 0;
          zzfxC = args[6] || 0;
          zzfxM = args[7] || 0;
          zzfxU = args[8] || 0;
          zzfxL = args[9] || 0;
          zzfxA = args[10] || 0;
          zzfxW = args[11] || 0;
          zzfxH = args[12] || 0;
          zzfxG = args[13] || 0; }
        let zzfxFreq = 220,
          zzfxFreqRamp = 0;
        let sampleCount = Math.floor(zzfxR * sampleRate);
        let phase = 0;
        let amp = zzfxV;
        let buffer = [];
        for (let i = 0; i < sampleCount; i++) {
          let t = i / sampleRate;
          let env = Math.exp(-t * 3) * (1 - t / zzfxR);
          let freq = zzfxFreq * (1 + zzfxFreqRamp * t / zzfxR);
          phase += (2 * Math.PI * freq) / sampleRate;
          let sample = Math.sin(phase) * env * amp;
          if (zzfxQ > 0.1) {
            let sq = Math.sign(Math.sin(phase)) * env * amp * 0.3;
            sample = sample * (1 - zzfxQ) + sq * zzfxQ;
          }
          if (zzfxS > 0.01) {
            let noise = (Math.random() * 2 - 1) * zzfxS * env * amp;
            sample += noise;
          }
          buffer.push(sample);
        }
        try {
          const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
          const buffer2 = audioCtx.createBuffer(1, buffer.length, sampleRate);
          const data = buffer2.getChannelData(0);
          for (let i = 0; i < buffer.length; i++) data[i] = buffer[i] * 0.8;
          const source = audioCtx.createBufferSource();
          source.buffer = buffer2;
          const gain = audioCtx.createGain();
          gain.gain.value = vol * 0.7;
          source.connect(gain);
          gain.connect(audioCtx.destination);
          source.start();
          setTimeout(() => { try { source.stop(); } catch (e) {} }, zzfxR * 1000 + 200);
        } catch (e) { /* ignore */ }
      };

      function sfxShoot() { zzfx(0.05, 0.2, 0, 0, 0.3, 0, 0, 1.5, 0, 0, 0, 0, 0, 0); }

      function sfxHit() { zzfx(0.08, 0.25, 0.2, 0.1, 0.5, 0, 0, 1.2, 0, 0, 0, 0, 0, 0); }

      function sfxEnemyDie() { zzfx(0.12, 0.3, 0.1, 0.05, 0.7, 0, 0, 2.0, 0, 0, 0, 0, 0, 0); }

      function sfxDamage() { zzfx(0.15, 0.35, 0.4, 0.1, 0.2, 0, 0, 0.6, 0, 0, 0, 0, 0, 0); }

      function sfxWave() { zzfx(0.2, 0.3, 0, 0, 0.6, 0, 0, 3.0, 0, 0, 0, 0, 0, 0); }

      // -------- Utility --------
      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function rand(min, max) { return Math.random() * (max - min) + min; }

      function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

      // -------- Particles --------
      function spawnParticles(x, y, color, count = 15, speed = 4) {
        for (let i = 0; i < count; i++) {
          const angle = rand(0, Math.PI * 2);
          const spd = rand(0.5, speed);
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: rand(20, 50),
            maxLife: 50,
            radius: rand(2, 5),
            color: color,
          });
        }
      }

      // -------- Spawn enemies --------
      function spawnEnemy() {
        const side = randInt(0, 3);
        let x, y;
        const margin = 30;
        if (side === 0) { x = rand(-margin, W + margin);
          y = -margin; } else if (side === 1) { x = W + margin;
          y = rand(-margin, H + margin); } else if (side === 2) { x = rand(-margin, W + margin);
          y = H + margin; } else { x = -margin;
          y = rand(-margin, H + margin); }
        const radius = ENEMY_BASE_RADIUS + rand(-3, 5);
        const speed = enemySpeed + rand(-0.2, 0.4);
        const hp = 1 + Math.floor(wave / 5);
        enemies.push({
          x,
          y,
          radius: Math.max(6, radius),
          speed: Math.max(0.5, speed),
          hp: hp,
          maxHp: hp,
          color: `hsl(${randInt(200, 320)}, 80%, 60%)`,
        });
      }

      // -------- Wave management --------
      function startWave() {
        enemiesPerWave = Math.min(5 + wave * 2, 40);
        enemySpeed = 1.2 + wave * 0.15;
        spawnInterval = Math.max(15, 60 - wave * 2);
        enemyCount = 0;
        spawnTimer = 0;
        sfxWave();
        waveSpan.textContent = wave;
      }

      // -------- Reset game --------
      function resetGame() {
        player.x = W / 2;
        player.y = H / 2;
        player.hp = MAX_HP;
        bullets = [];
        enemies = [];
        particles = [];
        score = 0;
        wave = 1;
        gameOver = false;
        gameRunning = true;
        gamePaused = false;
        frame = 0;
        spawnTimer = 0;
        enemySpeed = 1.2;
        enemiesPerWave = 5;
        spawnInterval = 60;
        enemyCount = 0;
        hpSpan.textContent = player.hp;
        scoreSpan.textContent = score;
        waveSpan.textContent = wave;
        overlay.classList.remove('show');
        startWave();
      }

      // -------- Game update --------
      function update() {
        if (!gameRunning || gamePaused || gameOver) return;
        frame++;

        // Player movement
        let dx = 0,
          dy = 0;
        if (keys.w || keys.up) dy = -1;
        if (keys.s || keys.down) dy = 1;
        if (keys.a || keys.left) dx = -1;
        if (keys.d || keys.right) dx = 1;
        if (dx !== 0 && dy !== 0) {
          dx *= 0.707;
          dy *= 0.707;
        }
        player.x += dx * PLAYER_SPEED;
        player.y += dy * PLAYER_SPEED;
        player.x = clamp(player.x, player.radius, W - player.radius);
        player.y = clamp(player.y, player.radius, H - player.radius);

        // Shooting (mouse click or space)
        if (mouse.pressed) {
          const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
          bullets.push({
            x: player.x + Math.cos(angle) * (player.radius + 4),
            y: player.y + Math.sin(angle) * (player.radius + 4),
            vx: Math.cos(angle) * BULLET_SPEED,
            vy: Math.sin(angle) * BULLET_SPEED,
            radius: BULLET_RADIUS,
            life: 120,
          });
          sfxShoot();
          mouse.pressed = false; // single shot per click
        }

        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx;
          b.y += b.vy;
          b.life--;
          if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10 || b.life <= 0) {
            bullets.splice(i, 1);
            continue;
          }
          // Collision with enemies
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (dist(b, e) < b.radius + e.radius) {
              e.hp--;
              sfxHit();
              spawnParticles(b.x, b.y, e.color, 8, 3);
              if (e.hp <= 0) {
                // enemy dies
                sfxEnemyDie();
                spawnParticles(e.x, e.y, e.color, 20, 5);
                score += 10 + Math.floor(wave * 2);
                scoreSpan.textContent = score;
                enemies.splice(j, 1);
                enemyCount++;
                // Check wave completion
                if (enemyCount >= enemiesPerWave && enemies.length === 0) {
                  wave++;
                  startWave();
                }
              }
              hit = true;
              break;
            }
          }
          if (hit) {
            bullets.splice(i, 1);
          }
        }

        // Spawn enemies
        spawnTimer++;
        if (spawnTimer >= spawnInterval && enemies.length < enemiesPerWave - enemyCount) {
          spawnEnemy();
          spawnTimer = 0;
        }

        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;
          // Collision with player
          if (dist(e, player) < e.radius + player.radius) {
            // Damage player
            player.hp -= 10 + Math.floor(wave / 3);
            sfxDamage();
            spawnParticles(player.x, player.y, '#ff4466', 20, 6);
            enemies.splice(i, 1);
            if (player.hp <= 0) {
              player.hp = 0;
              gameOver = true;
              gameRunning = false;
              overlayTitle.textContent = '💀 GAME OVER';
              overlayScore.textContent = `Score: ${score}  ·  Wave: ${wave}`;
              overlay.classList.add('show');
            }
            hpSpan.textContent = player.hp;
            continue;
          }
          // Keep in bounds (but they are mostly chasing)
          e.x = clamp(e.x, -20, W + 20);
          e.y = clamp(e.y, -20, H + 20);
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.life--;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }

        // UI update
        hpSpan.textContent = Math.max(0, player.hp);
      }

      // -------- Draw --------
      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Background grid
        ctx.strokeStyle = 'rgba(0,240,255,0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 20; i++) {
          const p = i * 30;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, H);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(W, p);
          ctx.stroke();
        }

        // Draw particles
        for (const p of particles) {
          const alpha = p.life / p.maxLife;
          ctx.globalAlpha = alpha;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        // Draw enemies
        for (const e of enemies) {
          // Glow
          ctx.shadowColor = e.color;
          ctx.shadowBlur = 25;
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          // Health bar
          ctx.shadowBlur = 0;
          const hpPct = e.hp / e.maxHp;
          const barW = e.radius * 1.6;
          const barH = 4;
          const barX = e.x - barW / 2;
          const barY = e.y - e.radius - 8;
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(barX, barY, barW, barH);
          ctx.fillStyle = hpPct > 0.6 ? '#44ff88' : hpPct > 0.3 ? '#ffaa44' : '#ff4466';
          ctx.fillRect(barX, barY, barW * hpPct, barH);
          // Inner highlight
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          ctx.beginPath();
          ctx.arc(e.x - e.radius * 0.2, e.y - e.radius * 0.2, e.radius * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw bullets
        for (const b of bullets) {
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 20;
          ctx.fillStyle = '#00f0ff';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          // Trail
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(0,240,255,0.3)';
          ctx.beginPath();
          ctx.arc(b.x - b.vx * 0.5, b.y - b.vy * 0.5, b.radius * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Draw player
        // Glow
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 40;
        const grad = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.radius);
        grad.addColorStop(0, '#44ddff');
        grad.addColorStop(0.7, '#0088ff');
        grad.addColorStop(1, '#003366');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        // Inner highlight
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(player.x - player.radius * 0.25, player.y - player.radius * 0.25, player.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
        // Shield ring
        ctx.strokeStyle = 'rgba(0,240,255,0.2)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // HP bar above player
        const hpPct2 = player.hp / player.maxHp;
        const barW2 = 40;
        const barH2 = 5;
        const barX2 = player.x - barW2 / 2;
        const barY2 = player.y - player.radius - 14;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX2, barY2, barW2, barH2);
        ctx.fillStyle = hpPct2 > 0.6 ? '#44ff88' : hpPct2 > 0.3 ? '#ffaa44' : '#ff4466';
        ctx.fillRect(barX2, barY2, barW2 * hpPct2, barH2);

        // HUD extras: wave and enemies remaining
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Enemies: ${enemies.length} / ${enemiesPerWave - enemyCount}`, 16, 68);
        ctx.textAlign = 'right';
        ctx.fillText(`Wave ${wave}`, W - 16, 68);

        // Crosshair (mouse)
        if (mouse.x !== undefined) {
          ctx.strokeStyle = 'rgba(255,255,255,0.2)';
          ctx.lineWidth = 1;
          const cx = mouse.x,
            cy = mouse.y;
          const size = 10;
          ctx.beginPath();
          ctx.moveTo(cx - size, cy);
          ctx.lineTo(cx + size, cy);
          ctx.moveTo(cx, cy - size);
          ctx.lineTo(cx, cy + size);
          ctx.stroke();
        }

        // Pause overlay
        if (gamePaused && !gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.font = '40px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('⏸ PAUSED', W / 2, H / 2);
        }
      }

      // -------- Game loop --------
      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      // -------- Input handling --------
      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w') keys.w = true;
        if (key === 'a') keys.a = true;
        if (key === 's') keys.s = true;
        if (key === 'd') keys.d = true;
        if (key === 'arrowup') keys.up = true;
        if (key === 'arrowdown') keys.down = true;
        if (key === 'arrowleft') keys.left = true;
        if (key === 'arrowright') keys.right = true;
        if (key === ' ' || key === 'space') {
          e.preventDefault();
          mouse.pressed = true;
        }
        if (key === 'p') {
          togglePause();
        }
        if (key === 'r' && gameOver) {
          resetGame();
        }
      });
      document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w') keys.w = false;
        if (key === 'a') keys.a = false;
        if (key === 's') keys.s = false;
        if (key === 'd') keys.d = false;
        if (key === 'arrowup') keys.up = false;
        if (key === 'arrowdown') keys.down = false;
        if (key === 'arrowleft') keys.left = false;
        if (key === 'arrowright') keys.right = false;
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouse.x = (e.clientX - rect.left) * scaleX;
        mouse.y = (e.clientY - rect.top) * scaleY;
        mouse.x = clamp(mouse.x, 0, W);
        mouse.y = clamp(mouse.y, 0, H);
      });

      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (!gameRunning || gamePaused || gameOver) return;
        mouse.pressed = true;
      });

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const tx = (touch.clientX - rect.left) * scaleX;
        const ty = (touch.clientY - rect.top) * scaleY;
        mouse.x = clamp(tx, 0, W);
        mouse.y = clamp(ty, 0, H);
        if (!gameRunning || gamePaused || gameOver) return;
        mouse.pressed = true;
        // Also move player towards touch for mobile? We'll keep separate controls.
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const tx = (touch.clientX - rect.left) * scaleX;
        const ty = (touch.clientY - rect.top) * scaleY;
        mouse.x = clamp(tx, 0, W);
        mouse.y = clamp(ty, 0, H);
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        // Not setting mouse.pressed false because we use single-shot on touchstart
      }, { passive: false });

      // Pause toggle
      function togglePause() {
        if (gameOver) return;
        gamePaused = !gamePaused;
        pauseBtn.textContent = gamePaused ? '▶ PLAY' : '⏸ PAUSE';
      }
      pauseBtn.addEventListener('click', togglePause);

      // Restart
      restartBtn.addEventListener('click', resetGame);

      // -------- Init --------
      resetGame();
      gameLoop();

      // Resize canvas to fit container
      function resizeCanvas() {
        const wrapper = document.getElementById('gameWrapper');
        const maxWidth = window.innerWidth - 32;
        const maxHeight = window.innerHeight - 32;
        let size = Math.min(maxWidth, maxHeight, 600);
        size = Math.max(size, 320);
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      console.log('🔮 NEON SURVIVOR loaded – survive the waves!');
    })();
  </script>
</body>
