<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL GEOMETRY · 100 Rules of Ruin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a12;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #14141e;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.08);
            border: 1px solid #2a2a3e;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
            background: #10101a;
            image-rendering: pixelated;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 12px 18px;
            background: #1a1a2a;
            border-radius: 14px;
            border-left: 4px solid #00ffff;
            color: #b0b0d0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .info-panel .mission {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
        }
        .info-panel .mission span {
            color: #00ffff;
        }
        .info-panel .rule-name {
            font-size: 18px;
            background: #0d0d1a;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #3a3a5a;
            color: #ffd700;
        }
        .info-panel .rule-desc {
            font-size: 13px;
            color: #8888aa;
            flex: 1;
            min-width: 150px;
            text-align: right;
        }
        .info-panel .hp {
            color: #ff5555;
            font-size: 18px;
            font-weight: bold;
            margin-right: 10px;
        }
        .controls {
            margin-top: 10px;
            color: #555577;
            font-size: 13px;
            text-align: center;
            letter-spacing: 1px;
        }
        .controls kbd {
            background: #22223a;
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid #444466;
            color: #ccccee;
        }
        .reset-btn {
            background: #2a2a44;
            border: none;
            color: #aaaacc;
            padding: 4px 16px;
            border-radius: 40px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: #3a3a66;
            color: #ffffff;
        }
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .win-overlay.show {
            display: flex;
        }
        .win-box {
            background: #1a1a2e;
            padding: 40px 60px;
            border-radius: 32px;
            border: 2px solid #ffd700;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.2);
        }
        .win-box h1 {
            color: #ffd700;
            font-size: 48px;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .win-box p {
            color: #aaaacc;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .win-box .sub {
            color: #666688;
            font-size: 14px;
        }
        .win-box button {
            background: #ffd700;
            border: none;
            padding: 12px 48px;
            border-radius: 60px;
            font-size: 22px;
            font-weight: bold;
            color: #0a0a12;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .win-box button:hover {
            transform: scale(1.05);
            background: #ffe44d;
        }
    </style>
</head>
<body>

    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h1>✦ NULL GEOMETRY ✦</h1>
            <p id="winTitle">Mission Complete</p>
            <div class="sub" id="winSub">You have conquered the dungeon.</div>
            <br>
            <button id="winBtn">CONTINUE</button>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="info-panel">
            <div class="mission">MISSION <span id="missionNum">1</span>/100</div>
            <div class="hp">❤️ <span id="hpDisplay">5</span></div>
            <div class="rule-name" id="ruleName">THE DESCENT</div>
            <div class="rule-desc" id="ruleDesc">standard dungeon crawl</div>
            <button class="reset-btn" id="resetBtn">↺ RESTART</button>
        </div>
        <div class="controls">
            <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp; reach the <span style="color:#ffd700;">★</span> to advance
        </div>
    </div>

    <script>
        // ─── CANVAS SETUP ───────────────────────────────────────────────
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 600,
            H = 600;

        // ─── DOM REFS ──────────────────────────────────────────────────
        const missionNumEl = document.getElementById('missionNum');
        const hpDisplayEl = document.getElementById('hpDisplay');
        const ruleNameEl = document.getElementById('ruleName');
        const ruleDescEl = document.getElementById('ruleDesc');
        const winOverlay = document.getElementById('winOverlay');
        const winTitle = document.getElementById('winTitle');
        const winSub = document.getElementById('winSub');
        const winBtn = document.getElementById('winBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ─── INPUT ─────────────────────────────────────────────────────
        const keys = { up: false, down: false, left: false, right: false };
        let movePressed = false;

        window.addEventListener('keydown', (e) => {
            const k = e.key;
            if (k === 'ArrowUp' || k === 'w') { keys.up = true;
                movePressed = true;
                e.preventDefault(); }
            if (k === 'ArrowDown' || k === 's') { keys.down = true;
                movePressed = true;
                e.preventDefault(); }
            if (k === 'ArrowLeft' || k === 'a') { keys.left = true;
                movePressed = true;
                e.preventDefault(); }
            if (k === 'ArrowRight' || k === 'd') { keys.right = true;
                movePressed = true;
                e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key;
            if (k === 'ArrowUp' || k === 'w') { keys.up = false;
                e.preventDefault(); }
            if (k === 'ArrowDown' || k === 's') { keys.down = false;
                e.preventDefault(); }
            if (k === 'ArrowLeft' || k === 'a') { keys.left = false;
                e.preventDefault(); }
            if (k === 'ArrowRight' || k === 'd') { keys.right = false;
                e.preventDefault(); }
        });

        // ─── GAME STATE ────────────────────────────────────────────────
        let state = {};

        function initState(mission) {
            const config = createMissionConfig(mission);
            const size = config.size;
            const map = generateMaze(size, mission);
            const player = { x: 1, y: 1, hp: 5, maxHp: 5, invincible: 0 };
            // place player on first floor tile
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (map[y][x] === 0) { player.x = x;
                        player.y = y; break; }
                }
                if (map[player.y] && map[player.y][player.x] === 0) break;
            }
            // place exit far away
            let exit = { x: size - 2, y: size - 2 };
            for (let y = size - 1; y >= 0; y--) {
                let found = false;
                for (let x = size - 1; x >= 0; x--) {
                    if (map[y][x] === 0 && (Math.abs(x - player.x) + Math.abs(y - player.y)) > size * 0.6) {
                        exit = { x, y };
                        found = true;
                        break;
                    }
                }
                if (found) break;
            }
            // enemies
            const enemies = [];
            const eCount = config.enemyCount;
            let attempts = 0;
            while (enemies.length < eCount && attempts < 500) {
                attempts++;
                const ex = 1 + Math.floor(Math.random() * (size - 2));
                const ey = 1 + Math.floor(Math.random() * (size - 2));
                if (map[ey] && map[ey][ex] === 0 && !(ex === player.x && ey === player.y) && !(ex === exit.x && ey === exit
                        .y)) {
                    const hp = config.flags.boss ? 20 : 1;
                    enemies.push({
                        x: ex,
                        y: ey,
                        hp: hp,
                        maxHp: hp,
                        cooldown: 0,
                        split: false
                    });
                }
            }
            // floor life for crumble
            let floorLife = null;
            if (config.flags.floorCrumble) {
                floorLife = [];
                for (let y = 0; y < size; y++) {
                    floorLife[y] = [];
                    for (let x = 0; x < size; x++) {
                        floorLife[y][x] = (map[y][x] === 0) ? 3 : 0;
                    }
                }
            }

            state = {
                mission,
                config,
                map,
                size,
                player,
                exit,
                enemies,
                floorLife,
                turn: 0,
                gameOver: false,
                won: false,
                exitPrev: { x: exit.x, y: exit.y },
                bossPhase: 0,
                projectiles: [],
                // fog explored
                explored: null,
            };
            if (config.flags.fog) {
                state.explored = [];
                for (let y = 0; y < size; y++) {
                    state.explored[y] = new Array(size).fill(false);
                }
            }
            // initial camera offset for rotation
            state.rotationOffset = 0;
            updateUI();
        }

        // ─── MISSION CONFIGURATOR (100 unique rules) ──────────────────
        function createMissionConfig(mission) {
            const base = {
                size: 10 + Math.floor(mission / 5),
                enemyCount: 2 + Math.floor(mission / 4),
                enemySpeed: 0.6 + (mission / 100) * 1.0,
                playerSpeed: 3.5,
                flags: {
                    reverse: false,
                    controlExit: false,
                    floorCrumble: false,
                    torus: false,
                    timeOnMove: false,
                    enemiesShoot: false,
                    enemiesTeleport: false,
                    enemiesSplit: false,
                    fog: false,
                    rotateMap: false,
                    gravity: false,
                    boss: false,
                },
                name: "",
                desc: ""
            };

            // --- PHASE 1 (1-10) : Standard ---
            if (mission <= 10) {
                base.name = "THE DESCENT";
                base.desc = "classic dungeon crawl";
            }
            // --- PHASE 2 (11-20) : Crumbling floor ---
            else if (mission <= 20) {
                base.flags.floorCrumble = true;
                base.name = "QUICKSAND";
                base.desc = "floors collapse behind you";
            }
            // --- PHASE 3 (21-30) : Reverse controls ---
            else if (mission <= 30) {
                base.flags.reverse = true;
                base.name = "MIRROR WORLD";
                base.desc = "controls are inverted";
            }
            // --- PHASE 4 (31-40) : Control the exit ---
            else if (mission <= 40) {
                base.flags.controlExit = true;
                base.name = "PUPPETEER";
                base.desc = "move the exit, not yourself";
            }
            // --- PHASE 5 (41-50) : Torus + shooter enemies ---
            else if (mission <= 50) {
                base.flags.torus = true;
                base.flags.enemiesShoot = true;
                base.name = "WARP ZONE";
                base.desc = "world wraps, enemies shoot";
            }
            // --- PHASE 6 (51-60) : Time-on-move + split enemies ---
            else if (mission <= 60) {
                base.flags.timeOnMove = true;
                base.flags.enemiesSplit = true;
                base.name = "FROZEN TIME";
                base.desc = "time moves only when you do, enemies split";
            }
            // --- PHASE 7 (61-70) : Fog + teleporting enemies ---
            else if (mission <= 70) {
                base.flags.fog = true;
                base.flags.enemiesTeleport = true;
                base.name = "SHADOW REALM";
                base.desc = "fog of war, teleporting foes";
            }
            // --- PHASE 8 (71-80) : Gravity + rotating map ---
            else if (mission <= 80) {
                base.flags.gravity = true;
                base.flags.rotateMap = true;
                base.name = "TWISTED DIMENSION";
                base.desc = "gravity shifts, map rotates";
            }
            // --- PHASE 9 (81-99) : Chaos combo ---
            else if (mission <= 99) {
                base.flags.floorCrumble = true;
                base.flags.enemiesShoot = true;
                base.flags.timeOnMove = true;
                base.flags.enemiesSplit = true;
                base.name = "CHAOS ENGINE";
                base.desc = "everything breaks at once";
                base.enemyCount = 3 + Math.floor(mission / 10);
            }
            // --- PHASE 10 (100) : The Boss ---
            else {
                base.flags.boss = true;
                base.flags.controlExit = true;
                base.flags.torus = true;
                base.flags.enemiesShoot = true;
                base.flags.enemiesSplit = true;
                base.flags.rotateMap = true;
                base.name = "NULL CORE";
                base.desc = "the final abomination";
                base.enemyCount = 1;
                base.size = 16;
            }

            // cap size
            if (base.size > 30) base.size = 30;
            return base;
        }

        // ─── MAZE GENERATION (Recursive Backtracking) ────────────────
        function generateMaze(size, seed) {
            // seeded random for deterministic maps per mission
            let s = seed * 1337 + 42;

            function seededRandom() {
                s = (s * 9301 + 49297) % 233280;
                return s / 233280;
            }
            const map = [];
            for (let y = 0; y < size; y++) {
                map[y] = new Array(size).fill(1);
            }

            function carve(cx, cy) {
                map[cy][cx] = 0;
                const dirs = [
                    [0, -2],
                    [0, 2],
                    [-2, 0],
                    [2, 0]
                ];
                // shuffle with seeded random
                for (let i = dirs.length - 1; i > 0; i--) {
                    const j = Math.floor(seededRandom() * (i + 1));
                    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
                }
                for (let d of dirs) {
                    const nx = cx + d[0],
                        ny = cy + d[1];
                    if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && map[ny][nx] === 1) {
                        map[cy + d[1] / 2][cx + d[0] / 2] = 0;
                        carve(nx, ny);
                    }
                }
            }
            carve(1, 1);
            // ensure at least some open space
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (map[y][x] === 1 && Math.random() < 0.15) map[y][x] = 0;
                }
            }
            return map;
        }

        // ─── UPDATE LOGIC ──────────────────────────────────────────────
        function updateState() {
            if (state.gameOver || state.won) return;
            const config = state.config;
            const flags = config.flags;
            const size = state.size;

            // ---- Turn-based trigger ----
            if (flags.timeOnMove) {
                if (!movePressed) return;
                movePressed = false;
                state.turn++;
            }

            // ---- Rotation ----
            if (flags.rotateMap && state.turn % 8 === 0 && state.turn > 0) {
                state.rotationOffset = (state.rotationOffset + 1) % 4;
            }

            // ---- Player movement ----
            let dx = 0,
                dy = 0;
            if (keys.up) dy = -1;
            if (keys.down) dy = 1;
            if (keys.left) dx = -1;
            if (keys.right) dx = 1;

            // gravity
            if (flags.gravity) {
                if (dx === 0 && dy === 0) dy = 1; // pull down
            }

            // reverse
            if (flags.reverse) { dx = -dx;
                dy = -dy; }

            // control exit
            let pdx = dx,
                pdy = dy;
            if (flags.controlExit) {
                // move exit instead
                let ex = state.exit.x + dx;
                let ey = state.exit.y + dy;
                if (flags.torus) {
                    ex = (ex + size) % size;
                    ey = (ey + size) % size;
                }
                if (ex >= 0 && ex < size && ey >= 0 && ey < size && state.map[ey][ex] === 0) {
                    state.exitPrev = { x: state.exit.x, y: state.exit.y };
                    state.exit.x = ex;
                    state.exit.y = ey;
                }
                // player follows exit's previous position
                const targetX = state.exitPrev.x;
                const targetY = state.exitPrev.y;
                if (state.map[targetY] && state.map[targetY][targetX] === 0) {
                    state.player.x = targetX;
                    state.player.y = targetY;
                }
                // force no movement for player
                dx = 0;
                dy = 0;
            } else {
                // normal move
                let nx = state.player.x + dx;
                let ny = state.player.y + dy;
                if (flags.torus) {
                    nx = (nx + size) % size;
                    ny = (ny + size) % size;
                }
                if (nx >= 0 && nx < size && ny >= 0 && ny < size && state.map[ny][nx] === 0) {
                    state.player.x = nx;
                    state.player.y = ny;
                }
            }

            // ---- Floor crumble ----
            if (flags.floorCrumble && state.floorLife) {
                const px = state.player.x,
                    py = state.player.y;
                if (state.floorLife[py] && state.floorLife[py][px] !== undefined) {
                    state.floorLife[py][px] -= 1;
                    if (state.floorLife[py][px] <= 0) {
                        state.map[py][px] = 1; // becomes wall
                    }
                }
            }

            // ---- Fog exploration ----
            if (flags.fog && state.explored) {
                const px = state.player.x,
                    py = state.player.y;
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        const nx = px + dx,
                            ny = py + dy;
                        if (nx >= 0 && nx < size && ny >= 0 && ny < size) {
                            state.explored[ny][nx] = true;
                        }
                    }
                }
            }

            // ---- Enemies AI ----
            const enemies = state.enemies;
            const speed = config.enemySpeed;

            // teleport
            if (flags.enemiesTeleport && state.turn % 3 === 0) {
                for (let e of enemies) {
                    if (e.hp <= 0) continue;
                    // teleport to random floor near player
                    for (let attempt = 0; attempt < 10; attempt++) {
                        const tx = state.player.x + Math.floor(Math.random() * 5) - 2;
                        const ty = state.player.y + Math.floor(Math.random() * 5) - 2;
                        if (tx >= 0 && tx < size && ty >= 0 && ty < size && state.map[ty][tx] === 0 && !(tx === state
                                .player.x && ty === state.player.y)) {
                            e.x = tx;
                            e.y = ty;
                            break;
                        }
                    }
                }
            }

            // enemy movement (chase)
            for (let e of enemies) {
                if (e.hp <= 0) continue;
                // shoot
                if (flags.enemiesShoot && e.cooldown <= 0 && Math.random() < 0.04) {
                    const dx = state.player.x - e.x;
                    const dy = state.player.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0 && dist < 8) {
                        state.projectiles.push({
                            x: e.x,
                            y: e.y,
                            vx: (dx / dist) * 0.15,
                            vy: (dy / dist) * 0.15,
                            life: 40
                        });
                        e.cooldown = 15;
                    }
                }
                if (e.cooldown > 0) e.cooldown--;

                // move towards player
                let ex = e.x,
                    ey = e.y;
                let bestDist = Infinity;
                let bestDx = 0,
                    bestDy = 0;
                const dirs = [
                    [0, -1],
                    [0, 1],
                    [-1, 0],
                    [1, 0]
                ];
                for (let d of dirs) {
                    let nx = e.x + d[0],
                        ny = e.y + d[1];
                    if (flags.torus) {
                        nx = (nx + size) % size;
                        ny = (ny + size) % size;
                    }
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size && state.map[ny][nx] === 0) {
                        const dist = Math.abs(nx - state.player.x) + Math.abs(ny - state.player.y);
                        if (dist < bestDist) {
                            bestDist = dist;
                            bestDx = d[0];
                            bestDy = d[1];
                        }
                    }
                }
                if (bestDist < Infinity) {
                    let nx = e.x + bestDx,
                        ny = e.y + bestDy;
                    if (flags.torus) {
                        nx = (nx + size) % size;
                        ny = (ny + size) % size;
                    }
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size && state.map[ny][nx] === 0) {
                        e.x = nx;
                        e.y = ny;
                    }
                }
            }

            // ---- Projectiles ----
            for (let p of state.projectiles) {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                // check hit player
                if (Math.abs(p.x - state.player.x) < 0.6 && Math.abs(p.y - state.player.y) < 0.6) {
                    if (state.player.invincible <= 0) {
                        state.player.hp--;
                        state.player.invincible = 20;
                        p.life = 0;
                    }
                }
            }
            state.projectiles = state.projectiles.filter(p => p.life > 0 && p.x > 0 && p.x < size && p.y > 0 && p.y < size);

            // ---- Enemy collision with player ----
            for (let e of enemies) {
                if (e.hp <= 0) continue;
                if (e.x === state.player.x && e.y === state.player.y) {
                    if (state.player.invincible <= 0) {
                        state.player.hp--;
                        state.player.invincible = 20;
                        // push enemy back
                        const dx = e.x - state.player.x;
                        const dy = e.y - state.player.y;
                        if (dx === 0 && dy === 0) { e.x += 1;
                            e.y += 1; } else { e.x += dx;
                            e.y += dy; }
                    }
                }
            }

            // ---- player invincibility timer ----
            if (state.player.invincible > 0) state.player.invincible--;

            // ---- check win condition ----
            if (state.player.x === state.exit.x && state.player.y === state.exit.y) {
                state.won = true;
                showWin();
                return;
            }

            // ---- check game over ----
            if (state.player.hp <= 0) {
                state.gameOver = true;
                state.player.hp = 0;
                updateUI();
                return;
            }

            // ---- Boss special ----
            if (flags.boss && enemies.length > 0) {
                const boss = enemies[0];
                if (boss.hp > 0 && boss.hp < boss.maxHp * 0.5) {
                    // spawn adds
                    if (state.bossPhase === 0) {
                        state.bossPhase = 1;
                        for (let i = 0; i < 4; i++) {
                            const ex = state.player.x + Math.floor(Math.random() * 5) - 2;
                            const ey = state.player.y + Math.floor(Math.random() * 5) - 2;
                            if (ex >= 0 && ex < size && ey >= 0 && ey < size && state.map[ey][ex] === 0) {
                                state.enemies.push({ x: ex, y: ey, hp: 2, maxHp: 2, cooldown: 0, split: false });
                            }
                        }
                    }
                }
            }

            // ---- enemy split ----
            if (flags.enemiesSplit) {
                const toAdd = [];
                for (let e of enemies) {
                    if (e.hp <= 0 && !e.split) {
                        e.split = true;
                        for (let i = 0; i < 2; i++) {
                            const nx = e.x + (i === 0 ? 1 : -1);
                            const ny = e.y + (i === 0 ? 0 : 1);
                            if (nx >= 0 && nx < size && ny >= 0 && ny < size && state.map[ny][nx] === 0) {
                                toAdd.push({ x: nx, y: ny, hp: 1, maxHp: 1, cooldown: 0, split: false });
                            }
                        }
                    }
                }
                enemies.push(...toAdd);
            }
            // remove dead enemies (unless they are split)
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (enemies[i].hp <= 0 && enemies[i].split === true) {
                    enemies.splice(i, 1);
                }
            }

            // ---- enemy hp reset for non-boss? no, keep them dead.
            // clean up projectiles
            updateUI();
        }

        // ─── RENDER ────────────────────────────────────────────────────
        function render() {
            const { map, size, player, exit, enemies, config, floorLife, explored, projectiles } = state;
            const flags = config.flags;
            const cellSize = W / size;

            ctx.clearRect(0, 0, W, H);

            // ---- apply rotation ----
            let rot = 0;
            if (flags.rotateMap) {
                rot = state.rotationOffset * Math.PI / 2;
            }
            ctx.save();
            ctx.translate(W / 2, H / 2);
            ctx.rotate(rot);
            ctx.translate(-W / 2, -H / 2);

            // ---- draw floor & walls ----
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const cx = x * cellSize,
                        cy = y * cellSize;

                    // fog
                    if (flags.fog && explored && !explored[y]?.[x]) {
                        ctx.fillStyle = '#0a0a12';
                        ctx.fillRect(cx, cy, cellSize + 0.5, cellSize + 0.5);
                        continue;
                    }

                    const isWall = map[y][x] === 1;
                    if (isWall) {
                        ctx.fillStyle = '#1e1e30';
                        ctx.fillRect(cx, cy, cellSize + 0.5, cellSize + 0.5);
                        ctx.strokeStyle = '#2e2e48';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(cx, cy, cellSize, cellSize);
                    } else {
                        // floor
                        let alpha = 1;
                        if (floorLife && floorLife[y] && floorLife[y][x] !== undefined) {
                            alpha = floorLife[y][x] / 3;
                            if (alpha < 0.2) alpha = 0.2;
                        }
                        ctx.fillStyle = `rgba(18, 18, 34, ${alpha})`;
                        ctx.fillRect(cx, cy, cellSize + 0.5, cellSize + 0.5);
                        // subtle grid
                        ctx.strokeStyle = '#22223a';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(cx, cy, cellSize, cellSize);
                    }
                }
            }

            // ---- draw projectiles ----
            for (let p of projectiles) {
                ctx.beginPath();
                ctx.arc(p.x * cellSize + cellSize / 2, p.y * cellSize + cellSize / 2, cellSize * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = '#ff8844';
                ctx.shadowColor = '#ff8844';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- draw enemies ----
            for (let e of enemies) {
                if (e.hp <= 0) continue;
                const cx = e.x * cellSize + cellSize / 2;
                const cy = e.y * cellSize + cellSize / 2;
                const radius = cellSize * 0.35;
                const pulse = 1 + 0.15 * Math.sin(Date.now() / 200 + e.x);
                ctx.beginPath();
                ctx.arc(cx, cy, radius * pulse, 0, Math.PI * 2);
                const isBoss = config.flags.boss && e === enemies[0];
                ctx.fillStyle = isBoss ? '#ff2255' : '#ff3344';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = isBoss ? 25 : 12;
                ctx.fill();
                // HP bar for boss
                if (isBoss && e.maxHp > 1) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#222';
                    ctx.fillRect(e.x * cellSize + 2, e.y * cellSize - 4, cellSize - 4, 4);
                    ctx.fillStyle = '#ff2255';
                    ctx.fillRect(e.x * cellSize + 2, e.y * cellSize - 4, (cellSize - 4) * (e.hp / e.maxHp), 4);
                }
                ctx.shadowBlur = 0;
            }

            // ---- draw exit ----
            const ex = exit.x * cellSize + cellSize / 2;
            const ey = exit.y * cellSize + cellSize / 2;
            const glow = 8 + 4 * Math.sin(Date.now() / 300);
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = glow;
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(ex, ey - cellSize * 0.4);
            ctx.lineTo(ex + cellSize * 0.4, ey);
            ctx.lineTo(ex, ey + cellSize * 0.4);
            ctx.lineTo(ex - cellSize * 0.4, ey);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // ---- draw player ----
            if (!state.gameOver) {
                const px = player.x * cellSize + cellSize / 2;
                const py = player.y * cellSize + cellSize / 2;
                const flash = player.invincible > 0 && Math.floor(Date.now() / 100) % 2 === 0;
                if (!flash) {
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.moveTo(px, py - cellSize * 0.45);
                    ctx.lineTo(px - cellSize * 0.35, py + cellSize * 0.35);
                    ctx.lineTo(px + cellSize * 0.35, py + cellSize * 0.35);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            ctx.restore();

            // ---- UI overlay (mission, hp) ----
            updateUI();
        }

        // ─── UI UPDATE ──────────────────────────────────────────────────
        function updateUI() {
            missionNumEl.textContent = state.mission || 1;
            hpDisplayEl.textContent = state.player ? state.player.hp : 5;
            if (state.config) {
                ruleNameEl.textContent = state.config.name || "UNKNOWN";
                ruleDescEl.textContent = state.config.desc || "";
            }
        }

        // ─── WIN / LOSE ────────────────────────────────────────────────
        function showWin() {
            winOverlay.classList.add('show');
            if (state.mission >= 100) {
                winTitle.textContent = '✦ YOU WIN ✦';
                winSub.textContent = 'You have conquered all 100 layers of Null Geometry.';
                winBtn.textContent = '★ PLAY AGAIN ★';
            } else {
                winTitle.textContent = `MISSION ${state.mission} COMPLETE`;
                winSub.textContent = `Advancing to Mission ${state.mission + 1} ...`;
                winBtn.textContent = '▶ CONTINUE';
            }
        }

        function hideWin() {
            winOverlay.classList.remove('show');
            if (state.mission >= 100) {
                // restart from 1
                state.mission = 0;
            }
            state.mission++;
            if (state.mission > 100) state.mission = 1;
            initState(state.mission);
            gameLoop();
        }

        winBtn.addEventListener('click', hideWin);
        resetBtn.addEventListener('click', () => {
            hideWin();
            initState(state.mission || 1);
            gameLoop();
        });

        // ─── GAME LOOP ──────────────────────────────────────────────────
        let animationId = null;

        function gameLoop() {
            if (animationId) cancelAnimationFrame(animationId);

            function loop() {
                if (!state.won && !state.gameOver) {
                    updateState();
                }
                render();
                if (state.gameOver) {
                    // show lose overlay
                    winTitle.textContent = '☠ YOU DIED ☠';
                    winSub.textContent = `Failed at Mission ${state.mission} · Press CONTINUE to retry`;
                    winBtn.textContent = '↻ RETRY';
                    winOverlay.classList.add('show');
                }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // ─── START ──────────────────────────────────────────────────────
        initState(1);
        gameLoop();

        // ─── HANDLE RESIZE (keep canvas crisp) ────────────────────────
        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const maxW = window.innerWidth - 60;
            const maxH = window.innerHeight - 220;
            let size = Math.min(600, maxW, maxH);
            size = Math.max(300, size);
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
